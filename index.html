<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Workout Tracker</h1>

    <form id="task-form" class="task-form">
      <input
        type="text"
        id="task-input"
        placeholder="Add an exercise"
        autocomplete="off"
        required
      >
      <button type="submit">Add</button>
    </form>

    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Remaining</button>
      <button class="filter-btn" data-filter="completed">Done</button>
    </div>

    <ul id="task-list" class="task-list"></ul>

    <p id="empty-state" class="empty-state">No exercises yet — add one above.</p>

    <footer class="app-footer">
      <span id="task-count">0 exercises</span>
      <button id="clear-completed" class="link-btn">Clear done</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>

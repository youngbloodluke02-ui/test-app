<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23e8491c'/%3E%3Cpath d='M7 12h2M15 12h2M9 8v8M15 8v8M9 12h6' stroke='%23fffaf5' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div class="toolbar">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M5 5l1.5 1.5M17.5 17.5 19 19M3 12h2M19 12h2M5 19l1.5-1.5M17.5 6.5 19 5"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </div>

    <header class="app-head">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M4 12h2M18 12h2M8 7v10M16 7v10M8 12h8"/></svg>
      </div>
      <div>
        <p class="eyebrow">Today's session</p>
        <h1>Workout Tracker</h1>
      </div>
      <div class="ring" id="ring" role="img" aria-label="0 percent complete">
        <svg viewBox="0 0 64 64">
          <circle class="ring-track" cx="32" cy="32" r="27"/>
          <circle class="ring-fill" id="ring-fill" cx="32" cy="32" r="27"/>
        </svg>
        <span class="ring-label" id="ring-label">0%</span>
      </div>
    </header>

    <form id="task-form" class="task-form">
      <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <input
        type="text"
        id="task-input"
        placeholder="Add an exercise"
        autocomplete="off"
        required
      >
      <button type="submit">Add</button>
    </form>

    <div class="filters" id="filters" role="tablist">
      <span class="filter-thumb" id="filter-thumb" aria-hidden="true"></span>
      <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
      <button class="filter-btn" data-filter="active" role="tab" aria-selected="false">Remaining</button>
      <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false">Done</button>
    </div>

    <ul id="task-list" class="task-list"></ul>

    <div id="empty-state" class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 12h2M18 12h2M8 7v10M16 7v10M8 12h8"/></svg>
      <p>No exercises yet</p>
      <span>Add your first move above to start today's session.</span>
    </div>

    <footer class="app-footer">
      <span id="task-count">0 exercises remaining</span>
      <button id="clear-completed" class="link-btn">Clear done</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
